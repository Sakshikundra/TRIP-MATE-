<svg xmlns="http://www.w3.org/2000/svg" width="240" height="70" viewBox="0 0 240 70" fill="none">
  <!-- Sun -->
  <circle cx="118" cy="20" r="14" fill="#FBB040" />
  
  <!-- Mountains -->
  <polygon points="90,42 120,18 150,42" fill="#52796F" />
  <polygon points="120,42 145,22 170,42" fill="#2D5A43" />
  <polygon points="105,42 120,24 135,42" fill="#84A98C" opacity="0.9" />
  <!-- Snowcaps -->
  <polygon points="115,22 120,18 125,22 122,24 118,24" fill="#FFFFFF" />
  <polygon points="141,25 145,22 149,25 147,27 143,27" fill="#FFFFFF" />

  <!-- Birds -->
  <path d="M 142 12 Q 145 10 148 12 Q 151 10 154 12" stroke="#1B4332" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Flight Path -->
  <path d="M 72 26 C 90 14, 110 44, 160 36 C 175 33, 185 40, 182 46" stroke="#1B4332" stroke-width="2" stroke-dasharray="3 3" fill="none" stroke-linecap="round" />
  
  <!-- Airplane -->
  <g transform="translate(68, 22) rotate(-25) scale(0.75)">
    <path d="M12 2 L14 8 L22 10 L14 13 L15 19 L12 17 L9 19 L10 13 L2 10 L10 8 Z" fill="#163E2B" />
  </g>

  <!-- Location Pin -->
  <g transform="translate(182, 16) scale(0.85)">
    <path d="M12 0 C5.37 0 0 5.37 0 12 C0 21 12 32 12 32 C12 32 24 21 24 12 C24 5.37 18.63 0 12 0 Z" fill="#E76F3C"/>
    <circle cx="12" cy="11" r="4.5" fill="#FFFFFF"/>
    <!-- Small rays around pin -->
    <line x1="26" y1="6" x2="30" y2="4" stroke="#1B4332" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="14" x2="31" y2="14" stroke="#1B4332" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="22" x2="28" y2="25" stroke="#1B4332" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography: Trip in Forest Green, मेट in Warm Saffron -->
  <text x="32" y="62" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#163E2B" letter-spacing="-0.8">Trip<tspan font-family="'Noto Sans Devanagari', 'Poppins', 'Segoe UI', sans-serif" font-weight="900" fill="#E76F3C" dx="3">मेट</tspan></text>
</svg>