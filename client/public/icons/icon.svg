  <!-- Devanagari / Brand Mark overlay at bottom -->
  <text x="256" y="455" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="64" font-weight="900" fill="#E76F3C" text-anchor="middle" letter-spacing="4">Tripमेट</text>
