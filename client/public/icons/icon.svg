<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#081c15"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Sun -->
  <circle cx="256" cy="180" r="70" fill="#FBB040" />
  
  <!-- Mountains -->
  <polygon points="120,380 256,200 392,380" fill="#52796F" />
  <polygon points="256,380 360,230 464,380" fill="#40916C" />
  <polygon points="180,380 256,240 332,380" fill="#95D5B2" opacity="0.85" />
  
  <!-- Snowcaps -->
  <polygon points="236,226 256,200 276,226 264,236 248,236" fill="#FFFFFF" />
  <polygon points="344,253 360,230 376,253 368,261 352,261" fill="#FFFFFF" />
  
  <!-- Airplane -->
  <g transform="translate(130, 150) rotate(-25) scale(2.2)">
    <path d="M12 2 L14 8 L22 10 L14 13 L15 19 L12 17 L9 19 L10 13 L2 10 L10 8 Z" fill="#FFFFFF" />
  </g>

  <!-- Location Pin with pulse -->
  <g transform="translate(360, 160) scale(2.6)">
    <path d="M12 0 C5.37 0 0 5.37 0 12 C0 21 12 32 12 32 C12 32 24 21 24 12 C24 5.37 18.63 0 12 0 Z" fill="#E76F3C"/>
